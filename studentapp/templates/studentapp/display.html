<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
</head>

<body style="background-color: lightblue;">

    <div style="text-align: center;">
        <h1>Welcome to display all students page</h1>

        {% if data %}
        <!-- here data is key we created in display function context dictonary inside checking if data is there in context dictionary then only below table will be executed -->
        <!-- {{data}} <br> -->
        <hr> <!-- to check data is coming or not in html page -->

        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">Roll Number</th>
                    <th scope="col">Name Of Student</th>
                    <th scope="col">Marks</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>

                {% for i in data %}
                <!-- here we are using for loop to iterate data key value one by one and inside data key we have list of objects so we can access each object fields using dot operator-->
                <!-- i is variable we created to iterate data key value one by one -->

                <tr>
                    <th scope="row">{{i.roll}}</th>
                    <!-- here i is variable we created to iterate data key value one by one and inside data key we have list of objects so we can access each object fields using dot operator-->
                    <td>{{i.name}}</td>
                    <td>{{i.marks}}</td>
                    <td>
                        <a class="btn btn-warning" href="/student/update-student/{{ i.roll }}/"
                            role="button">Update</a> &nbsp;&nbsp; 
                        <a class="btn btn-danger" href="/student/delete-student/{{ i.roll }}/" role="button">Delete</a>
                    </td>
                </tr>

                {% endfor %}
            </tbody>
        </table>
        {% endif %}

        <hr> <br>

        <a class="btn btn-primary" href="/student/insert-students/" role="button"> add_Student </a> <br><br>
        <a class="btn btn-warning" href="/student/display-all/" role="button"> Display all students</a>

    </div>
</body>

</html>
