<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</head>

<body style="background-color: lightblue;">

    <div style="text-align: center;">
        <h1>Welcome to Update Page</h1>

        <h1>Update Student {{ data.name }}</h1> <br> <!-- here data.name will key.variable inside name variable data will show name of student -->

        <form action="/student/update-student/{{ data.roll }}/" method="post"> <!-- here data.roll will key.variable inside roll variable data will show roll number of student and we are using post method to update data in database table -->
            {% csrf_token %} <!-- csrf_token is used to prevent cross site request forgery attack it will generate token for each post request -->

            Roll : <input type="number" name="rn" value="{{ data.roll }}" disabled> <br><br>

            Name : <input type="text" name="nm" value="{{ data.name }}"> <br><br>

            Marks : <input type="number" name="mk" value="{{ data.marks }}"> <br><br>

            <button type="submit">Update</button>
        </form>

        <hr> <br>

        <a class="btn btn-primary" href="/insert-students/" role="button"> add_Student </a> <br><br>
        <a class="btn btn-warning" href="/display-all/" role="button"> Display all students</a>

    </div>

</body>

</html>
